plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.herohan.uvcapp'
    compileSdk = rootProject.ext.versionCompiler

    defaultConfig {
        applicationId = "com.herohan.uvcapp"
        minSdk = rootProject.ext.versionMin
        targetSdk = rootProject.ext.versionTarget
        versionCode = 3
        versionName = "1.0.2"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = rootProject.ext.javaSourceCompatibility
        targetCompatibility = rootProject.ext.javaTargetCompatibility
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.github.getActivity:XXPermissions:13.5'
//    implementation 'com.github.warkiz.widget:indicatorseekbar:2.1.2'
    implementation 'com.github.warkiz:IndicatorSeekBar:v2.1.1'

    releaseImplementation 'jp.wasabeef:takt-no-op:2.1.1'
    debugImplementation 'jp.wasabeef:takt:2.1.1'

    implementation project(':libuvccamera')
//    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // debugImplementation because LeakCanary should only run in debug builds.
    // 使用 debugImplementation，因为 LeakCanary 只应在 debug 构建中运行。
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}