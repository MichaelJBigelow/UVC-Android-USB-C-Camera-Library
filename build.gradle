// Top-level build file where you can add configuration options common to all sub-projects/modules.
// 顶层构建文件，可在此添加所有子项目/模块共用的配置选项。
// Plugin and library versions live in gradle/libs.versions.toml.
// 插件和库的版本统一在 gradle/libs.versions.toml 中声明。
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.maven.publish) apply false
}

// Repositories are declared once, in settings.gradle (dependencyResolutionManagement).
// 仓库只在 settings.gradle(dependencyResolutionManagement)中声明一次。

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
