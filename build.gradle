// Top-level build file where you can add configuration options common to all sub-projects/modules.
// 顶层构建文件，可在此添加所有子项目/模块共用的配置选项。
// Plugin and library versions live in gradle/libs.versions.toml.
// 插件和库的版本统一在 gradle/libs.versions.toml 中声明。
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.maven.publish) apply false
}

allprojects {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/central' }

        maven { url = 'https://jitpack.io' }

        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    versionCompiler = 37
    versionTarget = 34
    versionMin = 29

    // Java language level for all modules. The build runs on JDK 25; Android bytecode targets Java 17.
    // 所有模块的 Java 语言级别。构建在 JDK 25 上运行；Android 字节码以 Java 17 为目标。
    javaSourceCompatibility = JavaVersion.VERSION_17
    javaTargetCompatibility = JavaVersion.VERSION_17
}
