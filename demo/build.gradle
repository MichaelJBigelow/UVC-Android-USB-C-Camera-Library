// Kotlin is compiled by AGP's built-in Kotlin support; the Compose plugin adds the Compose compiler.
// Kotlin 由 AGP 内置的 Kotlin 支持编译；Compose 插件负责添加 Compose 编译器。
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace = 'com.herohan.uvcdemo'
    compileSdk = rootProject.ext.versionCompiler

    defaultConfig {
        applicationId = "com.herohan.uvcdemo"
        minSdk = rootProject.ext.versionMin
        targetSdk = rootProject.ext.versionTarget
        versionCode = 2
        versionName = "1.0.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = rootProject.ext.javaSourceCompatibility
        targetCompatibility = rootProject.ext.javaTargetCompatibility
    }
    buildFeatures {
        compose = true
    }
}

dependencies {

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling

    implementation libs.xxPermissions

    // debugImplementation because LeakCanary should only run in debug builds.
    // 使用 debugImplementation,因为 LeakCanary 只应在 debug 构建中运行。
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'

    implementation project(':libuvccamera')
//    implementation 'com.herohan:UVCAndroid:1.0.13'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.androidx.test.uiautomator
}