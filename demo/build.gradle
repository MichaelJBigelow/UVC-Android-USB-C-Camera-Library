plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.herohan.uvcdemo'
    compileSdk = rootProject.ext.versionCompiler

    defaultConfig {
        applicationId = "com.herohan.uvcdemo"
        minSdk = rootProject.ext.versionMin
        targetSdk = rootProject.ext.versionTarget
        versionCode = 2
        versionName = "1.0.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = rootProject.ext.javaSourceCompatibility
        targetCompatibility = rootProject.ext.javaTargetCompatibility
    }
}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.material

    implementation libs.xxPermissions
//    implementation 'com.github.warkiz.widget:indicatorseekbar:2.1.2'
    implementation libs.indicatorSeekBar

    // debugImplementation because LeakCanary should only run in debug builds.
    // 使用 debugImplementation,因为 LeakCanary 只应在 debug 构建中运行。
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'

    implementation project(':libuvccamera')
//    implementation 'com.herohan:UVCAndroid:1.0.13'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.androidx.test.uiautomator
}