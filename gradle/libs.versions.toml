# Gradle version catalog: the single place where plugin and library versions are declared.
# Gradle 版本目录：集中声明插件和库版本的唯一位置。
# Build scripts refer to these entries as libs.<alias> and libs.plugins.<alias>.
# 构建脚本通过 libs.<别名> 和 libs.plugins.<别名> 引用这些条目。

[versions]
agp = "9.5.1"
mavenPublish = "0.37.0"

androidxAnnotation = "1.8.0"
androidxAppcompat = "1.6.1"
androidxConstraintlayout = "2.1.4"
androidxCore = "1.13.1"
androidxLegacySupport = "1.0.0"
androidxNavigation = "2.7.7"
androidxRecyclerview = "1.3.0"
androidxTestEspresso = "3.6.1"
androidxTestJunit = "1.2.1"
androidxTestUiautomator = "2.3.0"
gson = "2.10.1"
indicatorSeekBar = "v2.1.1"
junit = "4.13.2"
material = "1.10.0"
takt = "2.1.1"
xxPermissions = "13.5"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "androidxLegacySupport" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "androidxNavigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "androidxNavigation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
indicatorSeekBar = { module = "com.github.warkiz:IndicatorSeekBar", version.ref = "indicatorSeekBar" }
material = { module = "com.google.android.material:material", version.ref = "material" }
takt = { module = "jp.wasabeef:takt", version.ref = "takt" }
takt-no-op = { module = "jp.wasabeef:takt-no-op", version.ref = "takt" }
xxPermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxPermissions" }

# Test libraries
# 测试库
androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "androidxTestEspresso" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "androidxTestEspresso" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
