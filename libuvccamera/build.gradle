plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}

android {
    namespace = 'com.serenegiant.uvccamera'
    compileSdk = libs.versions.compileSdk.get().toInteger()

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Keep rules applied to every app that uses the library, in all build types.
        // 应用于所有使用本库的应用(所有构建类型)的保留规则。
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
//        cmake {
//            path "src/main/jni/CMakeLists.txt"
//        }
    }

    // Lint runs on every module the same way; existing warnings are kept in lint-baseline.xml so only
    // new ones are reported, and errors fail the build.
    // 每个模块都以相同方式运行 lint；已有的警告记录在 lint-baseline.xml 中，只报告新的问题，错误会导致构建失败。
    lint {
        baseline = file('lint-baseline.xml')
        abortOnError = true
        warningsAsErrors = false
        checkDependencies = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // The library only uses androidx.annotation (and the Kotlin standard library, added by AGP's
    // built-in Kotlin support); keep it light for the apps that depend on it.
    // 本库只使用 androidx.annotation(以及由 AGP 内置 Kotlin 支持添加的 Kotlin 标准库)；
    // 保持精简，避免给依赖它的应用带来多余的库。
    implementation libs.androidx.annotation

    testImplementation libs.junit
}

ext {
    libraryVersion = '1.0.13'
    publishedGroupId = 'com.herohan'
    artifact = 'UVCAndroid'
    libraryDescription = 'Library and sample to access UVC camera on non-rooted Android device'
    siteUrl = 'https://github.com/shiyinghan/UVCAndroid'
    gitUrl = 'https://github.com/shiyinghan/UVCAndroid.git'
    developerId = 'hansy'
    developerName = 'hansy'
    developerEmail = '1040762057@qq.com'
    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
}

apply from: "../publish_aar.gradle"